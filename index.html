<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kauan — Reconhecimento de Imagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --accent: #00c9a7;
      --accent2: #845ec2;
      --bg: #0d0d0d;
      --surface: #161616;
      --card: #1e1e1e;
      --border: rgba(255,255,255,0.07);
      --muted: #888;
      --text: #f0f0f0;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .site-header .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .site-header .tagline {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Cards ── */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      padding: 1.4rem;
    }

    .panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Webcam area ── */
    #webcam-placeholder {
      background: var(--surface);
      border: 2px dashed rgba(0,201,167,0.25);
      border-radius: 0.9rem;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .cam-svg { opacity: 0.3; margin-bottom: 0.25rem; }

    #webcam-container canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 0.9rem;
      border: 2px solid rgba(0,201,167,0.3);
      display: block;
    }

    /* ── Button ── */
    .btn-cam {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.78rem 2.2rem;
      border: none;
      border-radius: 3rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      box-shadow: 0 4px 22px rgba(0,201,167,0.35);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      overflow: hidden;
    }

    .btn-cam::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.15s;
      border-radius: inherit;
    }

    .btn-cam:hover::before { background: rgba(255,255,255,0.08); }
    .btn-cam:hover { transform: translateY(-2px); box-shadow: 0 7px 30px rgba(0,201,167,0.45); }
    .btn-cam:active { transform: scale(0.97); }
    .btn-cam:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-cam .spin {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Live badge ── */
    .live-pill {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #00e676;
      background: rgba(0,230,118,0.1);
      border: 1px solid rgba(0,230,118,0.3);
      border-radius: 2rem;
      padding: 0.2rem 0.7rem;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #00e676;
      animation: blink 1.4s infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Result cards ── */
    .result-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      transition: border-color 0.2s;
    }

    .result-item.top { border-color: rgba(0,201,167,0.45); }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.45rem;
      font-size: 0.85rem;
    }

    .result-name { font-weight: 600; color: var(--text); }

    .result-pct {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      min-width: 3.5rem;
      text-align: right;
    }

    .progress {
      height: 8px;
      border-radius: 1rem;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .progress-bar {
      border-radius: 1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.25s ease;
    }

    /* ── Empty state ── */
    .empty-state {
      color: var(--muted);
      font-size: 0.83rem;
      text-align: center;
      padding: 2rem 0;
    }

    /* ── Footer ── */
    .site-footer {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 2rem 1rem;
    }

    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header d-flex align-items-center justify-content-between flex-wrap gap-2">
  <div>
    <div class="brand">KAUAN</div>
    <div class="tagline">Reconhecimento de Imagem em Tempo Real</div>
  </div>
  <div class="live-pill" id="live-pill">
    <span class="live-dot"></span> AO VIVO
  </div>
</header>

<!-- Main -->
<main class="container py-4">
  <div class="row g-4 justify-content-center">

    <!-- Câmera -->
    <div class="col-12 col-lg-6">
      <div class="panel h-100 d-flex flex-column gap-3">
        <div class="panel-title">&#x1F4F7; Câmera</div>

        <div id="webcam-placeholder">
          <svg class="cam-svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          <span>Câmera inativa</span>
          <span style="font-size:0.75rem">Clique no botão abaixo para começar</span>
        </div>

        <div id="webcam-container"></div>

        <div class="text-center mt-auto pt-2">
          <button class="btn-cam" id="btn-init" onclick="init()">
            <span class="spin" id="btn-spin"></span>
            <svg id="btn-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
            </svg>
            <span id="btn-text">Iniciar Câmera</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Resultados -->
    <div class="col-12 col-lg-6">
      <div class="panel h-100 d-flex flex-column gap-3">
        <div class="panel-title">&#x1F4CA; Classificações</div>

        <div id="label-container">
          <div class="empty-state">
            Os resultados aparecerão aqui<br>após a câmera ser iniciada.
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer">
  Modelo via <a href="https://teachablemachine.withgoogle.com" target="_blank">Teachable Machine</a> &nbsp;·&nbsp; TensorFlow.js
</footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/QqrinaZ3n/";
  let model, webcam, maxPredictions;
  let running = false;

  async function init() {
    if (running) return;
    running = true;

    const btn      = document.getElementById('btn-init');
    const btnText  = document.getElementById('btn-text');
    const btnIcon  = document.getElementById('btn-icon');
    const btnSpin  = document.getElementById('btn-spin');

    btn.disabled     = true;
    btnIcon.style.display = 'none';
    btnSpin.style.display = 'block';
    btnText.textContent   = 'Carregando modelo…';

    try {
      model         = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(320, 320, true);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      document.getElementById('webcam-placeholder').style.display = 'none';
      document.getElementById('webcam-container').appendChild(webcam.canvas);
      document.getElementById('live-pill').style.display = 'inline-flex';

      btnSpin.style.display = 'none';
      btnIcon.innerHTML = '<polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.5" fill="none"/>';
      btnIcon.style.display = 'block';
      btnText.textContent = 'Câmera Ativa';

      buildLabels();

    } catch (err) {
      running = false;
      btn.disabled = false;
      btnSpin.style.display = 'none';
      btnIcon.style.display = 'block';
      btnText.textContent = 'Tentar Novamente';
      console.error(err);
    }
  }

  function buildLabels() {
    const container = document.getElementById('label-container');
    container.innerHTML = '';
    for (let i = 0; i < maxPredictions; i++) {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.id = 'item-' + i;
      div.innerHTML = `
        <div class="result-row">
          <span class="result-name" id="name-${i}">Classe ${i + 1}</span>
          <span class="result-pct" id="pct-${i}">0%</span>
        </div>
        <div class="progress">
          <div class="progress-bar" id="bar-${i}" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>`;
      container.appendChild(div);
    }
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);
    let topIdx = 0;
    for (let i = 1; i < maxPredictions; i++) {
      if (prediction[i].probability > prediction[topIdx].probability) topIdx = i;
    }
    for (let i = 0; i < maxPredictions; i++) {
      const pct = (prediction[i].probability * 100).toFixed(1);
      document.getElementById('name-' + i).textContent  = prediction[i].className;
      document.getElementById('pct-'  + i).textContent  = pct + '%';
      document.getElementById('bar-'  + i).style.width  = pct + '%';
      document.getElementById('bar-'  + i).setAttribute('aria-valuenow', pct);
      const item = document.getElementById('item-' + i);
      item.classList.toggle('top', i === topIdx);
    }
  }
</script>
</body>
</html>
